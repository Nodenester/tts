services:
  f5-tts:
    image: ghcr.io/swivid/f5-tts:main
    container_name: f5-tts-server
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./server.py:/app/server.py:ro
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./voices:/app/voices
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      bash -c "pip install fastapi uvicorn && python /app/server.py"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
